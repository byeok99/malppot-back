# docker-compose.yml
version: "3.8"

services:
  backend:
    build: .
    platform: linux/amd64
    container_name: malppot-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: malppot
      DB_PASSWORD: malppot
      DB_NAME: malppotDB

  db:
    image: mysql:8.0
    container_name: malppot-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: malppotDB
      MYSQL_USER: malppot
      MYSQL_PASSWORD: malppot
    volumes:
      - db_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d

volumes:
  db_data: