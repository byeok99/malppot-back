services:
  mysql:
    image: mysql:8.0
    container_name: malppot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: malppot
      MYSQL_DATABASE: malppot
      MYSQL_USER: malppot
      MYSQL_PASSWORD: malppot
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./back/malppot/init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmalppot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: malppot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  redis-data:
